[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "git-for-law-austria"
version = "0.1.0"
description = "Git-native versioning system for Austrian federal law"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "gitpython>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
    "mypy>=1.5",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
